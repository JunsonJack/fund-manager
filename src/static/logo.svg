<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1890ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#096dd9;stop-opacity:1" />
    </linearGradient>
    
    <!-- 光晕效果 -->
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
    
    <!-- 狗狗身体渐变 -->
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆 -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)"/>
  
  <!-- 光晕 -->
  <circle cx="100" cy="100" r="80" fill="url(#glowGradient)"/>
  
  <!-- 耳朵 -->
  <ellipse cx="55" cy="55" rx="22" ry="30" fill="#FFA500" transform="rotate(-20 55 55)"/>
  <ellipse cx="145" cy="55" rx="22" ry="30" fill="#FFA500" transform="rotate(20 145 55)"/>
  
  <!-- 耳朵内部 -->
  <ellipse cx="55" cy="55" rx="14" ry="20" fill="#FF8C00" transform="rotate(-20 55 55)"/>
  <ellipse cx="145" cy="55" rx="14" ry="20" fill="#FF8C00" transform="rotate(20 145 55)"/>
  
  <!-- 头部 -->
  <circle cx="100" cy="95" r="50" fill="url(#bodyGradient)"/>
  
  <!-- 脸部白色区域 -->
  <ellipse cx="100" cy="105" rx="32" ry="28" fill="#FFFFFF"/>
  
  <!-- 眼睛 -->
  <circle cx="82" cy="85" r="10" fill="#333333"/>
  <circle cx="118" cy="85" r="10" fill="#333333"/>
  
  <!-- 眼睛高光 -->
  <circle cx="85" cy="82" r="4" fill="#FFFFFF"/>
  <circle cx="121" cy="82" r="4" fill="#FFFFFF"/>
  
  <!-- AI 科技眼 (左眼) -->
  <circle cx="82" cy="85" r="6" fill="none" stroke="#00D4FF" stroke-width="2"/>
  <line x1="76" y1="85" x2="70" y2="85" stroke="#00D4FF" stroke-width="2"/>
  <line x1="88" y1="85" x2="94" y2="85" stroke="#00D4FF" stroke-width="2"/>
  <line x1="82" y1="79" x2="82" y2="73" stroke="#00D4FF" stroke-width="2"/>
  <line x1="82" y1="91" x2="82" y2="97" stroke="#00D4FF" stroke-width="2"/>
  
  <!-- AI 科技眼 (右眼) -->
  <circle cx="118" cy="85" r="6" fill="none" stroke="#00D4FF" stroke-width="2"/>
  <line x1="112" y1="85" x2="106" y2="85" stroke="#00D4FF" stroke-width="2"/>
  <line x1="124" y1="85" x2="130" y2="85" stroke="#00D4FF" stroke-width="2"/>
  <line x1="118" y1="79" x2="118" y2="73" stroke="#00D4FF" stroke-width="2"/>
  <line x1="118" y1="91" x2="118" y2="97" stroke="#00D4FF" stroke-width="2"/>
  
  <!-- 鼻子 -->
  <ellipse cx="100" cy="100" rx="8" ry="6" fill="#333333"/>
  
  <!-- 嘴巴 -->
  <path d="M 92 108 Q 100 116 108 108" fill="none" stroke="#333333" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- 腮红 -->
  <ellipse cx="70" cy="100" rx="8" ry="5" fill="#FFB6C1" opacity="0.6"/>
  <ellipse cx="130" cy="100" rx="8" ry="5" fill="#FFB6C1" opacity="0.6"/>
  
  <!-- 身体 -->
  <ellipse cx="100" cy="155" rx="35" ry="30" fill="url(#bodyGradient)"/>
  
  <!-- 肚子 -->
  <ellipse cx="100" cy="160" rx="22" ry="20" fill="#FFFFFF"/>
  
  <!-- 爪子 -->
  <ellipse cx="75" cy="175" rx="12" ry="8" fill="url(#bodyGradient)"/>
  <ellipse cx="125" cy="175" rx="12" ry="8" fill="url(#bodyGradient)"/>
  
  <!-- 爪子肉垫 -->
  <circle cx="72" cy="175" r="3" fill="#FF8C00"/>
  <circle cx="78" cy="175" r="3" fill="#FF8C00"/>
  <circle cx="122" cy="175" r="3" fill="#FF8C00"/>
  <circle cx="128" cy="175" r="3" fill="#FF8C00"/>
  
  <!-- 科技元素 - 上升箭头 (代表涨) -->
  <g transform="translate(145, 130)">
    <path d="M 0 15 L 0 -5 M -8 3 L 0 -5 L 8 3" fill="none" stroke="#00FF88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- 科技元素 - 下降箭头 (代表跌) -->
  <g transform="translate(55, 130)">
    <path d="M 0 -15 L 0 5 M -8 -3 L 0 5 L 8 -3" fill="none" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- 头顶科技光环 -->
  <circle cx="100" cy="45" r="4" fill="#00D4FF"/>
  <circle cx="85" cy="48" r="3" fill="#00D4FF" opacity="0.7"/>
  <circle cx="115" cy="48" r="3" fill="#00D4FF" opacity="0.7"/>
  
  <!-- 小星星装饰 -->
  <polygon points="155,55 157,61 163,61 158,65 160,71 155,67 150,71 152,65 147,61 153,61" fill="#FFD700" opacity="0.8"/>
  <polygon points="45,65 46,68 49,68 47,70 48,73 45,71 42,73 43,70 41,68 44,68" fill="#FFD700" opacity="0.6"/>
</svg>
